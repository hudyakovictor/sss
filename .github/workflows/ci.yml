name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: API tests
        run: pnpm test:e2e

      - name: Contract validation
        run: pnpm validate:contracts

      - name: Content validation
        run: pnpm validate:content

      - name: Locale validation
        run: pnpm validate:locales

      - name: Asset manifest validation
        run: pnpm validate:assets

      - name: Public client boundary validation
        run: pnpm validate:public-client

      - name: Build
        run: pnpm build

      - name: Design system typecheck
        run: pnpm design-system:typecheck

      - name: Design system build
        run: pnpm design-system:build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E + API integration (Playwright)
        run: pnpm test:browser
